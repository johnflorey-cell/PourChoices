name: Scrape retailer prices

on:
  schedule:
    # 06:17 Bahrain time (UTC+3) = 03:17 UTC, every THURSDAY. GitHub Actions
    # cron is UTC.
    #
    # Thursday change (2026-11-01): moved from Sunday to Thursday so prices
    # are fresh for the Bahrain weekend (Thursday evening, Friday, Saturday),
    # when most people use the app. Even if GitHub starts it several hours
    # late, it still finishes by Thursday afternoon.
    #
    # Off-the-hour change (2026-11-01): this used to start at exactly 03:00
    # UTC ("0 3 * * 0"). GitHub's free scheduler is busiest on the hour, and
    # the scheduled runs were starting 5-7 hours late (25 Oct: 08:09 UTC,
    # 1 Nov: 10:09 UTC). An odd minute like :17 usually gets picked up much
    # sooner. To change the time, edit the first two numbers (minute, hour).
    #
    # Weekly-in-Beta change (2026-09-18): this used to run every day ("0 3 *
    # * *"), but the BrightData dashboard showed 2,460 of the 5,000 monthly
    # proxy credits already used, and retailer prices/catalogs don't change
    # day to day, so a daily refresh was spending credit faster than it
    # needed to for a Beta app. Runs once a week now (Sunday) instead -- the
    # last number is the day-of-week field (0-6 = Sun-Sat, 4 = Thursday);
    # change it to pick a different day.
    - cron: "17 3 * * 4"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BRIGHTDATA_AUTH: ${{ secrets.BRIGHTDATA_AUTH }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's browser
        run: playwright install --with-deps chromium

      - name: Scrape BMMI
        run: python scrapers/bmmi.py
        continue-on-error: true   # one retailer's site being briefly down shouldn't block the others

      - name: Scrape African & Eastern
        run: python scrapers/ae.py
        continue-on-error: true

      - name: Scrape GBI Express
        run: python scrapers/gbi.py
        continue-on-error: true

      - name: Scrape NHSC
        run: python scrapers/nhsc.py
        continue-on-error: true

      - name: Merge into one product list
        run: python scrapers/merge.py

      - name: Commit updated data if it changed
        run: |
          git config user.name "pour-choices-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet && echo "No price changes." || git commit -m "Automated price refresh $(date -u +'%Y-%m-%d')"
          # This scraper run can take well over an hour (the proxy adds real
          # latency). If someone edits a file on GitHub's website while it's
          # still running, the remote moves ahead of what this runner
          # started from, and a plain "git push" gets rejected. Pulling with
          # --rebase first replays our new commit (if any) on top of
          # whatever changed meanwhile, so the push succeeds either way,
          # instead of the whole run's scraped data being silently dropped.
          git pull --rebase origin main
          git push
