name: Build search pages

# Rebuilds the Google-searchable pages (price/, prices/, sitemap.xml,
# robots.txt) from the prices already saved in data/products.json. No
# scraping and no Bright Data use, so it takes about a minute. The weekly
# "Scrape retailer prices" run does this too; this one is for running it by
# hand (Actions tab > Build search pages > Run workflow).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build search pages
        run: python scrapers/build_pages.py
      - name: Commit pages if they changed
        run: |
          git config user.name "pour-choices-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A price prices sitemap.xml robots.txt
          git diff --cached --quiet && echo "No page changes." || git commit -m "Rebuild search pages $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
